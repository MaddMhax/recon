<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recon — Connexion</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">RECON<span>_</span></div>
    <nav>
      <button class="theme-toggle secondary small" type="button" title="Thème clair / sombre">☀️</button>
    </nav>
  </header>

  <main>
    <div class="login-wrap">
      <div class="panel">
        <h1>RECON<span class="cursor">_</span></h1>
        <p class="subtitle">Connectez-vous pour accéder à l'application.</p>
        <form id="loginForm">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" autocomplete="username" required />
          <label for="password">Mot de passe</label>
          <input type="password" id="password" autocomplete="current-password" required />
          <div style="margin-top:16px">
            <button type="submit" style="width:100%">Se connecter</button>
          </div>
          <div class="error" id="loginError"></div>
        </form>
        <div id="ssoArea" class="hidden"></div>
      </div>
    </div>
  </main>

  <script src="/js/base.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
